[functions.create-company-bucket]
enabled = true
verify_jwt = true
import_map = "./functions/create-company-bucket/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
