# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-company-bucket/*.html" ]

# send-daily-reports trusts the JWT `role` claim for cron mode. That is only safe because
# the gateway verifies the signature first. Do not set verify_jwt = false or deploy this
# function with --no-verify-jwt.
[functions.send-daily-reports]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-daily-reports/index.ts"

# build-project-export and send-project-export trust the JWT `role` claim for their cron /
# queue modes (see _shared/common.ts verifiedJwtRole). Same rule: never disable verify_jwt.
[functions.build-project-export]
enabled = true
verify_jwt = true
entrypoint = "./functions/build-project-export/index.ts"

[functions.send-project-export]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-project-export/index.ts"

# Public, unauthenticated form endpoint for the landing page (no Supabase user session
# involved at all) -- verify_jwt = false is correct here, unlike the warning above about
# build-project-export/send-project-export's queue modes. PREPARED, NOT DEPLOYED; deploying
# this later still needs an explicit --no-verify-jwt flag since the CLI does not reliably
# pick this setting up from config.toml alone for every deploy path.
[functions.submit-contact]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-contact/index.ts"
